<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Happy Birthday, PLK!</title>
    <style>
      :root {
        color-scheme: light;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        background: linear-gradient(135deg, #ffe3ec, #e6f7ff);
        color: #2f2f2f;
      }

      main {
        width: min(90vw, 680px);
        text-align: center;
        padding: 2.5rem;
        border-radius: 1.25rem;
        background: rgba(255, 255, 255, 0.86);
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.1);
      }

      h1 {
        margin: 0 0 1rem;
        font-size: clamp(2rem, 6vw, 3rem);
      }

      p {
        margin: 0.6rem 0;
        font-size: 1.1rem;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>🎉 Happy Birthday, PLK! 🎂</h1>
      <p>Wishing you a year full of joy, laughter, and amazing memories.</p>
      <p>You are appreciated more than words can say. Have the best birthday ever!</p>
    </main>
  </body>
</html>
